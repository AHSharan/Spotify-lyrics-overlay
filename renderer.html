<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <!-- The server port may fall back to 8889/8890, so the loopback origin is wildcarded by port. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' http://127.0.0.1:*; script-src 'self'; style-src 'self';">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lyrics Overlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="overlay" class="overlay">
    <div id="header" class="header">
      <div id="title" data-text="">Not playing</div>
      <div id="controls">
        <button id="clickThroughBtn" title="Toggle click-through (Ctrl+Shift+L)">👆</button>
        <button id="authBtn" title="Login to Spotify">🎵</button>
        <button id="logoutBtn" title="Log out">⏻</button>
        <button id="refreshBtn" title="Refresh">↻</button>
        <button id="closeBtn" title="Close">×</button>
      </div>
    </div>
    <div id="status" class="status">—</div>
    <div id="lyrics" class="lyrics">Loading…</div>

    <!-- First run: no Client ID stored yet. -->
    <div id="setup" class="setup hidden">
      <h3>One-time setup</h3>
      <p>Paste your Spotify <strong>Client ID</strong>:</p>
      <input id="clientIdInput" type="text" placeholder="32 hex characters" spellcheck="false" />
      <button id="saveClientIdBtn">Save</button>
      <p id="setupError" class="setup-error"></p>
      <p class="setup-help">
        Create an app at <a href="#" id="dashboardLink">developer.spotify.com/dashboard</a>
        and add this exact Redirect URI:
      </p>
      <code id="redirectUriHint">http://127.0.0.1:8888/callback</code>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
